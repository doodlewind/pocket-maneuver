[workspace]
resolver = "2"
members = ["crates/maneuver-sim", "crates/maneuver-pack", "crates/maneuver-cook"]
# The Vita app builds with its own toolchain file and lockfile.
exclude = ["vita", "vendor"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
