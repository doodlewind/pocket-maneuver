[package]
name = "maneuver-cook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "World compiler of Pocket Maneuver: bakes lighting, builds cells and LODs, and writes the device pack"

[dependencies]
maneuver-sim = { path = "../maneuver-sim" }
maneuver-pack = { path = "../maneuver-pack" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
texpresso = { version = "2", features = ["rayon"] }
fontdue = "0.9"
