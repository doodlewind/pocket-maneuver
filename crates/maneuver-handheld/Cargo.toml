[package]
name = "maneuver-handheld"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Device-independent half of the PSP and 3DS runtimes of Pocket Maneuver: what to draw, the moving geometry, the interface and the game loop"

[features]
default = ["std"]
# Without `std` the crate needs only `core` and `alloc` (the device builds).
std = ["maneuver-sim/std", "maneuver-pack/std"]
hw-sqrt = ["maneuver-sim/hw-sqrt"]
single-float = ["maneuver-sim/single-float"]

[dependencies]
maneuver-sim = { path = "../maneuver-sim", default-features = false }
maneuver-pack = { path = "../maneuver-pack", default-features = false }
libm = "0.2"
