[package]
name = "pocket-maneuver-psp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Maneuver on PSP: the GE renderer, on-demand cells, the interface's guest and the device loop"

# cargo-psp builds a lone crate.
[workspace]

[dependencies]
# The interface (ui/) runs on PocketJS's PSP host library: QuickJS, the UI core, its GE backend and
# the one-block arena that serves them and Rust (it is the program's global allocator).
psp = { git = "https://github.com/pocket-nexus/rust-psp.git", rev = "2cbaf8c9bc72569c76240a1d9743de10731e5f6b", features = ["external-c-heap", "abort-only", "external-global-alloc"] }
libquickjs-sys = { git = "https://github.com/pocket-nexus/quickjs-rs.git", rev = "ba5bdd0dc013518768e76cd9e05cd30ed53dd35b" }
pocketjs-psp = { path = "../vendor/pocketjs/hosts/psp" }
maneuver-interface = { path = "../crates/maneuver-interface", default-features = false, features = ["guest"] }
# The Allegrex FPU has no doubles: single-precision kernels and its own square root.
maneuver-sim = { path = "../crates/maneuver-sim", default-features = false, features = ["hw-sqrt", "single-float"] }
maneuver-pack = { path = "../crates/maneuver-pack", default-features = false }
maneuver-handheld = { path = "../crates/maneuver-handheld", default-features = false }
pocket3d-title = { path = "../vendor/pocketjs/engine/pocket3d/crates/pocket3d-title" }
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The simulation and the shared runtime are optimized for size: the Allegrex has a 16 KB instruction
# cache, and a tick or a frame runs through far more code than that at opt-level 3. This crate itself
# stays at 3, as it was measured.
[profile.release.package.maneuver-sim]
opt-level = "s"
[profile.release.package.maneuver-handheld]
opt-level = "s"
[profile.release.package.maneuver-interface]
opt-level = "s"
[profile.release.package.maneuver-pack]
opt-level = "s"
[profile.release.package.libm]
opt-level = "s"
