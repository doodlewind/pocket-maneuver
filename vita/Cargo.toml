[package]
name = "pocket-maneuver-vita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pocket Maneuver on PS Vita: the world pack drawn through GXM at 60 frames per second"

# Vita-only binary built through cargo-vita (tools/maneuver.ts); excluded from
# the desktop workspace in the repository root.
[workspace]
resolver = "2"

[dependencies]
pocketjs-vita = { path = "../vendor/pocketjs/hosts/vita", default-features = false }
pocket-vita-gxm = { path = "../vendor/pocketjs/devices/vita/pocket-vita-gxm", features = ["runtime-compiler"] }
pocket3d-title = { path = "../vendor/pocketjs/engine/pocket3d/crates/pocket3d-title" }
maneuver-sim = { path = "../crates/maneuver-sim" }
maneuver-pack = { path = "../crates/maneuver-pack" }
serde_json = "1"
libm = "0.2"
sha2 = "0.10"

[target.'cfg(target_os = "vita")'.dependencies]
vita2d-sys = "0.1.1"
vitasdk-sys = { version = "0.3.3", features = ["SceGxm_stub", "SceKernelThreadMgr_stub", "SceLibKernel_stub", "ScePower_stub", "SceCtrl_stub", "SceDisplay_stub"] }

[features]
default = ["usb-debug"]
usb-debug = ["pocketjs-vita/usb-debug"]

[package.metadata.vita]
title_id = "PKMV00001"
title_name = "Pocket Maneuver"
build_std = "std,panic_abort"

[package.metadata.vita.profile.release]
strip_symbols = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
